<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Document RAG Assistant</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 18px;background:#f7f8fb;color:#19243c}button{background:#2159a5;color:white;border:0;border-radius:5px;padding:10px;cursor:pointer}input,select{padding:10px;margin:8px 0}input[type=text]{width:65%}pre{white-space:pre-wrap;background:white;padding:18px;border:1px solid #ddd;border-radius:8px}</style></head><body>
<h1>Intelligent Document Assistant</h1><p>Upload a text-based PDF and ask questions. Sources show retrieved excerpts with page numbers. OCR and visual highlighting are planned, not implemented.</p>
<h2>1. Upload PDF</h2><input id="pdf" type="file" accept="application/pdf"><button id="upload">Upload</button><p id="uploadStatus"></p>
<h2>2. Ask a question</h2><select id="docs"><option value="">Select a document</option></select><div><input id="question" type="text" placeholder="What is this document about?"><button id="ask">Ask</button></div><pre id="answer">No answer yet</pre>
<script>
async function refresh(){const docs=await (await fetch('/api/documents')).json();const sel=document.getElementById('docs');sel.innerHTML='<option value="">Select a document</option>';docs.forEach(d=>{let op=document.createElement('option');op.value=d.id;op.textContent=d.filename+' ('+d.page_count+' pages)';sel.appendChild(op)})}
document.getElementById('upload').onclick=async()=>{const f=document.getElementById('pdf').files[0],el=document.getElementById('uploadStatus');if(!f){el.textContent='Choose a PDF';return}const form=new FormData();form.append('file',f);const r=await fetch('/api/documents',{method:'POST',body:form});const result=await r.json();el.textContent=r.ok?'Uploaded: '+result.filename:JSON.stringify(result);await refresh();if(r.ok)document.getElementById('docs').value=result.id};
document.getElementById('ask').onclick=async()=>{const out=document.getElementById('answer');out.textContent='Searching...';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:document.getElementById('docs').value,question:document.getElementById('question').value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}};refresh();
</script></body></html>
