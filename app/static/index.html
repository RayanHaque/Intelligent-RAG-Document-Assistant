<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intelligent Document Assistant</title>
  <style>
    :root { color-scheme: light; font: 16px/1.55 system-ui, sans-serif; color: #17243a; background: #f4f7fc; --blue: #2055b6; --muted: #475977; --line: #d7e0ee; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--blue); text-underline-offset: .17em; }
    :focus-visible { outline: 3px solid #376bce; outline-offset: 3px; }
    .wrap { width: min(70rem, calc(100% - 2rem)); margin-inline: auto; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    header .wrap { min-height: 4rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .45rem 1rem; padding-block: .5rem; }
    header span { display: inline-flex; align-items: center; gap: .6rem; font-weight: 750; }
    .mark { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: .4rem; background: #153563; }
    .mark::before { content: ""; width: .72rem; height: .95rem; border: 1px solid #fff; border-radius: .1rem; background: repeating-linear-gradient(#fff 0 1px, transparent 1px 3px) center / 55% 42% no-repeat; }
    header a { font-size: .9rem; }
    main { padding-block: clamp(2rem, 7vw, 4.5rem); }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { font-size: clamp(2.1rem, 5vw, 3.65rem); letter-spacing: -.06em; }
    h2 { font-size: 1.25rem; letter-spacing: -.025em; }
    h3 { font-size: 1rem; }
    .lead { margin: .6rem 0 1.8rem; color: var(--muted); max-width: 57ch; }
    .workspace { display: grid; grid-template-columns: minmax(15rem, .85fr) minmax(0, 1.8fr); gap: 1rem; align-items: start; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: .85rem; padding: clamp(1rem, 3vw, 1.6rem); min-width: 0; }
    form { display: grid; gap: .7rem; }
    label { font-weight: 650; }
    select, textarea, input, button { font: inherit; }
    select, textarea, input[type=file] { width: 100%; min-width: 0; }
    select, textarea { padding: .65rem .75rem; border: 1px solid #aebed5; border-radius: .45rem; color: inherit; background: #fff; }
    textarea { resize: vertical; min-height: 6rem; }
    input[type=file] { padding: .55rem; border: 1px dashed #9fb5d1; border-radius: .45rem; font-size: .9rem; }
    input::file-selector-button { font: inherit; margin-right: .45rem; }
    button { justify-self: start; min-height: 44px; padding: .5rem .9rem; color: #fff; background: var(--blue); border: 1px solid transparent; border-radius: .45rem; font-weight: 700; cursor: pointer; }
    button:hover:not(:disabled) { background: #173f86; }
    button:disabled { opacity: .65; cursor: default; }
    .muted, .status { color: var(--muted); font-size: .9rem; }
    .status { min-height: 1.4rem; overflow-wrap: anywhere; }
    .error { color: #9b2634; }
    .library { display: grid; gap: .55rem; }
    .upload { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    .results { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: 1rem; }
    .result-head { display: flex; gap: .5rem 1rem; flex-wrap: wrap; justify-content: space-between; align-items: baseline; margin-bottom: .5rem; }
    .mode { color: #254880; background: #eaf1fc; border-radius: .3rem; padding: .14rem .5rem; font-size: .875rem; font-weight: 650; }
    .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
    .sources { margin-top: 1rem; }
    .sources ol { list-style: none; padding: 0; margin: .5rem 0 0; display: grid; gap: .5rem; }
    .sources li { padding: .65rem .8rem; border: 1px solid var(--line); border-radius: .4rem; background: #f7f9fd; scroll-margin-block: 1rem; }
    .sources li:target { border-color: #376bce; }
    .sources p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; margin-top: .25rem; }
    @media (max-width: 43rem) { .workspace { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <span><i class="mark" aria-hidden="true"></i>Document Assistant</span>
      <a href="/docs">API docs</a>
    </div>
  </header>
  <main class="wrap">
    <h1>Ask your PDF</h1>
    <p class="lead">Choose a document, ask a question, and check the excerpts behind the answer.</p>
    <div class="workspace">
      <section class="panel" aria-labelledby="library-title">
        <div class="library">
          <h2 id="library-title">Document library</h2>
          <label for="docs">Active document</label>
          <select id="docs" aria-describedby="library-status"><option value="">Loading documents…</option></select>
          <p id="library-status" class="status" role="status"></p>
        </div>
        <form id="upload-form" class="upload">
          <label for="pdf">Add a PDF</label>
          <p class="muted" id="file-limits">Selectable text, up to 10 MB and 100 pages.</p>
          <input id="pdf" type="file" accept=".pdf,application/pdf" aria-describedby="file-limits" required>
          <button id="upload" type="submit">Upload PDF</button>
          <p class="status" id="upload-status" role="status"></p>
        </form>
      </section>
      <section class="panel" aria-labelledby="question-title">
        <form id="ask-form">
          <h2 id="question-title"><label for="question">Ask a question</label></h2>
          <textarea id="question" placeholder="What are the main findings in this document?" rows="3" minlength="2" maxlength="2000" required></textarea>
          <button id="ask" type="submit" disabled>Search document</button>
          <p id="ask-status" class="status" role="status"></p>
        </form>
        <section class="results" aria-labelledby="answer-title">
          <div class="result-head"><h3 id="answer-title">Answer</h3><span id="mode" class="mode" hidden></span></div>
          <p id="answer" class="answer">Your answer and page references will appear here.</p>
          <section id="sources" class="sources" aria-labelledby="sources-title" hidden>
            <h3 id="sources-title">Source excerpts</h3>
            <ol id="source-list"></ol>
          </section>
        </section>
      </section>
    </div>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const docs = byId('docs');
    const question = byId('question');
    const ask = byId('ask');
    const upload = byId('upload');
    const pdf = byId('pdf');
    const answer = byId('answer');
    const mode = byId('mode');
    const sources = byId('sources');
    const sourceList = byId('source-list');
    const emptyAnswer = 'Your answer and page references will appear here.';
    let searching = false;
    let libraryRequest = 0;

    function status(id, message, error = false) {
      const element = byId(id);
      element.textContent = message;
      element.classList.toggle('error', error);
    }

    async function request(path, options) {
      const response = await fetch(path, options);
      const payload = await response.json().catch(() => null);
      if (!response.ok || payload === null) {
        const detail = typeof payload?.detail === 'string' ? payload.detail : 'Something went wrong. Please try again.';
        throw new Error(detail);
      }
      return payload;
    }

    function resetAnswer() {
      answer.textContent = emptyAnswer;
      mode.hidden = true;
      sources.hidden = true;
      sourceList.replaceChildren();
      status('ask-status', '');
    }

    function selectDocument(id) {
      if (docs.value !== id) {
        docs.value = id;
        resetAnswer();
      }
      ask.disabled = searching || !docs.value;
    }

    async function refresh(preferredId = docs.value) {
      const requestId = ++libraryRequest;
      try {
        const documents = await request('/api/documents');
        if (requestId !== libraryRequest) return;
        const currentId = docs.value;
        docs.replaceChildren(new Option('Select a document', ''));
        for (const document of documents) {
          const count = document.page_count;
          docs.add(new Option(document.filename + ' · ' + count + (count === 1 ? ' page' : ' pages'), document.id));
        }
        docs.value = documents.some(document => document.id === currentId) ? currentId : '';
        if (docs.value !== currentId) resetAnswer();
        selectDocument(documents.some(document => document.id === preferredId) ? preferredId : docs.value);
        status('library-status', documents.length ? '' : 'Upload a PDF to get started.');
      } catch (error) {
        if (requestId !== libraryRequest) return;
        if (!docs.value) docs.replaceChildren(new Option('Select a document', ''));
        status('library-status', error.message, true);
      }
    }

    docs.addEventListener('change', () => {
      ask.disabled = searching || !docs.value;
      resetAnswer();
    });

    byId('upload-form').addEventListener('submit', async event => {
      event.preventDefault();
      const file = pdf.files[0];
      if (!file || upload.disabled) return;
      if (!file.name.toLowerCase().endsWith('.pdf') || file.size > 10 * 1024 * 1024) {
        status('upload-status', 'Choose a PDF under 10 MB.', true);
        return;
      }
      upload.disabled = true;
      pdf.disabled = true;
      status('upload-status', 'Reading your PDF…');
      try {
        const body = new FormData();
        body.append('file', file);
        const result = await request('/api/documents', { method: 'POST', body });
        pdf.value = '';
        status('upload-status', 'Uploaded ' + result.filename + '.');
        await refresh(result.id);
      } catch (error) {
        status('upload-status', error.message, true);
      } finally {
        upload.disabled = false;
        pdf.disabled = false;
      }
    });

    function showSources(excerpts) {
      const firstByPage = new Map();
      excerpts.forEach((source, index) => {
        const item = document.createElement('li');
        item.id = 'excerpt-' + (index + 1);
        item.tabIndex = -1;
        const label = document.createElement('strong');
        label.textContent = 'Page ' + source.page;
        const excerpt = document.createElement('p');
        excerpt.textContent = source.excerpt;
        item.append(label, excerpt);
        sourceList.appendChild(item);
        if (!firstByPage.has(String(source.page))) firstByPage.set(String(source.page), item.id);
      });
      sources.hidden = excerpts.length === 0;
      return firstByPage;
    }

    function showResult(result, firstByPage) {
      const text = result.answer;
      answer.replaceChildren();
      let cursor = 0;
      for (const match of text.matchAll(/\[Page\s+([0-9]+)\]/gi)) {
        const target = firstByPage.get(match[1]);
        if (!target) continue;
        answer.append(text.slice(cursor, match.index));
        const link = document.createElement('a');
        link.href = '#' + target;
        link.textContent = match[0];
        answer.append(link);
        cursor = match.index + match[0].length;
      }
      answer.append(text.slice(cursor));
      mode.textContent = result.mode === 'gemini' ? 'Gemini answer' : 'Retrieval only';
      mode.hidden = false;
    }

    async function searchDocument(selected, query) {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/x-ndjson' },
        body: JSON.stringify({ document_id: selected, question: query }),
      });
      if (!response.ok) {
        const payload = await response.json().catch(() => null);
        throw new Error(typeof payload?.detail === 'string' ? payload.detail : 'Could not search this document.');
      }

      const stream = response.body.pipeThrough(new TextDecoderStream());
      let buffer = '';
      let firstByPage = new Map();
      let receivedAnswer = false;
      for await (const chunk of stream) {
        if (docs.value !== selected) return;
        const lines = (buffer + chunk).split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line) continue;
          const result = JSON.parse(line);
          if (result.type === 'sources') {
            firstByPage = showSources(result.sources);
            if (firstByPage.size) status('ask-status', 'Excerpts found. Preparing the answer…');
          } else if (result.type === 'answer') {
            showResult(result, firstByPage);
            receivedAnswer = true;
          }
        }
      }
      if (!receivedAnswer) throw new Error('The answer was interrupted. You can search again.');
      if (docs.value === selected) status('ask-status', 'Search complete.');
    }

    byId('ask-form').addEventListener('submit', async event => {
      event.preventDefault();
      const selected = docs.value;
      const query = question.value.trim();
      if (!selected || searching) return;
      if (query.length < 2) {
        status('ask-status', 'Enter a question with at least two characters.', true);
        return;
      }
      resetAnswer();
      searching = true;
      ask.disabled = true;
      docs.disabled = true;
      status('ask-status', 'Searching the document…');
      try {
        await searchDocument(selected, query);
      } catch (error) {
        if (docs.value === selected) status('ask-status', error.message, true);
      } finally {
        searching = false;
        docs.disabled = false;
        ask.disabled = !docs.value;
      }
    });

    refresh();
  </script>
</body>
</html>
